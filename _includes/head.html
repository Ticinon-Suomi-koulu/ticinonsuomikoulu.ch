{% include i18n.html %}
<head>
	<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="description" content="{{ ui.description }}" />
	<link rel="alternate" hreflang="{{ lang }}" href="{{ page.url | absolute_url }}" />
	{% if counterpart %}
	<link rel="alternate" hreflang="{% if lang == 'it' %}fi{% else %}it{% endif %}" href="{{ other_url | absolute_url }}" />
	{% endif %}
	<link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
	<link rel="icon" type="image/png" sizes="32x32" href="{{ "assets/images/favicon-32.png" | relative_url }}">
	<link rel="apple-touch-icon" href="{{ "assets/images/apple-touch-icon.png" | relative_url }}">
	<!--[if lte IE 8]><script src="{{ "assets/js/ie/html5shiv.js" | relative_url }}"></script><![endif]-->
	<link rel="stylesheet" href="{{ "assets/css/main.css" | relative_url }}" />
	<!--[if lte IE 9]><link rel="stylesheet" href="{{ "assets/css/ie9.css" | relative_url }}" /><![endif]-->
	<!--[if lte IE 8]><link rel="stylesheet" href="{{ "assets/css/ie8.css" | relative_url }}" /><![endif]-->
</head>
